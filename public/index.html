<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrossFit Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#FDFBF6;color:#2B2825;min-height:100vh}
.hdr{background:#FDFBF6;border-bottom:0.5px solid #D0C9BC;padding:14px 24px;display:flex;align-items:center;gap:12px}
.hdr h1{font-size:20px;font-weight:700;letter-spacing:0.3px;color:#2B2825;font-family:'Outfit',sans-serif;line-height:1.1}
.hdr .sub{font-size:10px;font-weight:500;color:#9BA3AC;letter-spacing:3px;text-transform:uppercase;margin-top:1px;font-family:'Outfit',sans-serif}
.nav{display:flex;gap:2px;padding:8px 20px;background:#FFFFFF;border-bottom:0.5px solid #D0C9BC;flex-wrap:wrap}
.nav button{padding:7px 15px 5px;border-radius:6px;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:#9BA3AC;font-family:inherit}
.nav button.act{background:transparent;color:#FF6B4A;border-bottom:2px solid #FF6B4A;border-radius:0;padding-bottom:5px}
.bod{padding:20px 24px;max-width:1100px;margin:0 auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
.card{background:#FFFFFF;border:1px solid #D0C9BC;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.ct{font-size:10px;font-weight:700;color:#2B2825;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;border-bottom:2px solid #E0D9CF;padding-bottom:8px}
.sc{background:#FFFFFF;border:1px solid #D0C9BC;border-radius:10px;padding:16px;text-align:center}
.sv{font-size:26px;font-weight:700;color:#2B2825;line-height:1}
.sl{font-size:9px;color:#9BA3AC;letter-spacing:2px;text-transform:uppercase;margin-top:5px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:6px 8px;font-size:10px;color:#9BA3AC;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #D0C9BC}
td{padding:7px 8px;font-size:12px;border-bottom:1px solid #D0C9BC}
tr:nth-child(even) td{background:#F6F5F2}
.prv{font-weight:700;color:#FF6B4A;font-size:13px}
.mut{color:#9BA3AC;font-size:10px}
.inp{background:#FFFFFF;border:1px solid #D0C9BC;color:#2B2825;border-radius:6px;padding:7px 10px;font-size:12px;width:100%;box-sizing:border-box;outline:none;font-family:inherit}
textarea.inp{min-height:120px;resize:vertical;line-height:1.6}
.btn{background:#2B2825;color:#fff;border:none;border-radius:6px;padding:9px 20px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.rn{padding:4px 10px;border-radius:4px;border:1px solid #D0C9BC;background:transparent;color:#9BA3AC;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.rn.act{border-color:#2B2825;background:#2B2825;color:#fff}
.badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px}
.badge-rx{background:#D2F5E9;color:#10B981}
.badge-sc{background:#F6E0E3;color:#A6293A}
.kb{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase;display:inline-block}
.kb-str{background:#F6E0E3;color:#A6293A}
.kb-met{background:#EEF3F8;color:#2B2825}
.kb-acc{background:#FCECD5;color:#E8871E}
.bc{border:1px solid #D0C9BC;border-radius:7px;padding:10px;margin-bottom:8px;background:#FFFFFF}
.sr{padding:10px 14px;border-radius:7px;margin-bottom:5px;background:#FFFFFF;border:1px solid #D0C9BC;cursor:pointer}
.sr.open{background:#EEF3F8;border-color:#2B2825;border-radius:7px 7px 0 0;margin-bottom:0}
.sd{padding:12px 14px 4px;margin-bottom:8px;background:#FFFFFF;border:1px solid #D0C9BC;border-top:none;border-radius:0 0 7px 7px}
.set-chip{background:#FFFFFF;border:1px solid #D0C9BC;border-radius:3px;padding:3px 7px;font-size:11px;font-family:monospace;display:inline-block;margin:2px}
.err{background:#F6E0E3;color:#A6293A;padding:10px 14px;border-radius:6px;font-size:12px;margin-bottom:12px}
.ok{color:#10B981;font-size:12px;font-weight:600;margin-top:8px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #D0C9BC;border-top-color:#2B2825;border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ratio-card{text-align:center;padding:14px;background:#FFFFFF;border:1px solid #D0C9BC;border-radius:10px}
.ratio-val{font-size:22px;font-weight:700;line-height:1}
.ratio-lbl{font-size:9px;color:#9BA3AC;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;font-weight:600}
.streak{padding:16px;border-radius:10px;text-align:center;border:1px solid}
.streak-g{background:#D2F5E9;border-color:#10B981;color:#10B981}
.streak-y{background:#FCECD5;border-color:#E8871E;color:#E8871E}
.streak-r{background:#F6E0E3;border-color:#A6293A;color:#A6293A}
.note-block{margin-top:6px;padding:8px 10px;background:#FDFBF6;border-left:3px solid #E8871E;border-radius:0 4px 4px 0;font-size:11px;color:#9BA3AC;white-space:pre-wrap;line-height:1.5}
.delta{font-size:10px;font-weight:600;margin-left:4px}
.delta-up{color:#10B981}
.delta-dn{color:#A6293A}
.delta-flat{color:#9BA3AC}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#9BA3AC"><div class="spin"></div></div></div>
<script type="module">
import{h,render}from'https://esm.sh/preact@10.19.3';
import{useState,useEffect,useMemo}from'https://esm.sh/preact@10.19.3/hooks';
import htm from'https://esm.sh/htm@3.1.1';
const html=htm.bind(h);

// ══════ SUPABASE ══════
let SB_URL='',SB_KEY='';
async function sbInit(){try{const r=await fetch('/api/config');const d=await r.json();SB_URL=d.supabaseUrl;SB_KEY=d.supabaseKey;}catch(e){console.error(e);}}
function sbH(){return{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
async function sbGet(t,p=''){const r=await fetch(SB_URL+'/rest/v1/'+t+'?'+p,{headers:sbH()});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbPost(t,d){const r=await fetch(SB_URL+'/rest/v1/'+t,{method:'POST',headers:{...sbH(),'Prefer':'return=representation,resolution=merge-duplicates'},body:JSON.stringify(d)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function sbDel(t,m){await fetch(SB_URL+'/rest/v1/'+t+'?'+m,{method:'DELETE',headers:sbH()});}

// ══════ CLASSIFIER (two-axis) ══════
function cls(nm){
  const n=(nm||'').toLowerCase().trim();
  if(!n)return{pat:null,sub:null,mod:null};
  // Carries/Holds
  if(/sled/.test(n))return{pat:null,sub:null,mod:'carries'};
  if(/farmer|yoke|front\s*rack\s*carry|sandbag\s*carry|\bsb\s*carry\b|sandbag\s*hold|\bsb\s*hold\b|bear\s*hug|waiter\s*carry/.test(n))return{pat:null,sub:null,mod:'carries'};
  if(/static\s*hold|dead\s*hang/.test(n))return{pat:null,sub:null,mod:'carries'};
  // Monostructural — machines
  if(/^cal\s|cal\s*row|cal\s*ski/.test(n))return{pat:null,sub:'machines',mod:'monostructural'};
  if(/\b(ski|bike|assault|echo)\b/.test(n))return{pat:null,sub:'machines',mod:'monostructural'};
  if(/\brow\b/.test(n)&&!/(barbell|db|bent|pendlay|ring)/.test(n))return{pat:null,sub:'machines',mod:'monostructural'};
  // Burpees — gymnastics BEFORE bounding checks so "Burpee BSO" etc. don't misclassify
  if(/burpee/.test(n))return{pat:'push',sub:'horizontal',mod:'gymnastics'};
  // Monostructural — bounding
  if(/shuttle\s*run|\b(run|sprint|jog)\b/.test(n))return{pat:null,sub:'bounding',mod:'monostructural'};
  if(/double\s*under/.test(n)||n==='du'||n==='dus')return{pat:null,sub:'bounding',mod:'monostructural'};
  if(/box\s*jump/.test(n))return{pat:null,sub:'bounding',mod:'monostructural'};
  if(/\bbjo\b|box\s*jump\s*over/.test(n))return{pat:null,sub:'bounding',mod:'monostructural'};
  if(/\bbso\b|box\s*step\s*over/.test(n))return{pat:null,sub:'bounding',mod:'monostructural'};
  if(/single\s*under|jump\s*rope/.test(n))return{pat:null,sub:'bounding',mod:'monostructural'};
  if(/broad\s*jump|lateral\s*bound/.test(n))return{pat:null,sub:'bounding',mod:'monostructural'};
  // Core
  if(n==='ttb'||n==='t2b'||/toes\s*to\s*bar/.test(n))return{pat:'core',sub:null,mod:'gymnastics'};
  if(/ghd|sit.?up|l-sit|plank|v-up|ab\s*mat|k2e|knee.*elbow|hollow/.test(n))return{pat:'core',sub:null,mod:'gymnastics'};
  if(/\bhkr\b|hanging\s*knee\s*raise/.test(n))return{pat:'core',sub:null,mod:'gymnastics'};
  // Pull — vertical (BMU before generic muscle-up)
  if(/\bbmu\b|bar\s*muscle.?up/.test(n))return{pat:'pull',sub:'vertical',mod:'gymnastics'};
  if(/pull.?up|muscle.?up|c2b|chest.?to|rope\s*climb|butterfly|kipping/.test(n))return{pat:'pull',sub:'vertical',mod:'gymnastics'};
  if(/strict\s*pull/.test(n))return{pat:'pull',sub:'vertical',mod:'gymnastics'};
  // Pull — horizontal
  if(/ring\s*row|\brr\b/.test(n))return{pat:'pull',sub:'horizontal',mod:'gymnastics'};
  if(/(barbell|db|pendlay|bent)\s*row/.test(n))return{pat:'pull',sub:'horizontal',mod:'weightlifting'};
  // Olympic squat variants
  if(/squat\s*(clean|snatch)/.test(n))return{pat:'squat',sub:'traditional',mod:'weightlifting'};
  if(/hang\s*squat/.test(n))return{pat:'squat',sub:'traditional',mod:'weightlifting'};
  // Olympic hinge variants
  if(/^hps$|hang\s*power\s*snatch/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/power\s*(clean|snatch)/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(n==='c&j'||/clean\s*(&|and)\s*jerk/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/db\s*(hang\s*)?(snatch|clean)/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/hang\s*(power\s*)?(clean|snatch)/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/\bclean\b/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/\bsnatch\b/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/over\s*shoulder/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  // Squat
  if(/wall\s*ball/.test(n))return{pat:'squat',sub:'traditional',mod:'weightlifting'};
  if(/goblet\s*lunge/.test(n))return{pat:'squat',sub:'single_leg',mod:'weightlifting'};
  if(/squat|ohs\b|overhead\s*sq|goblet/.test(n))return{pat:'squat',sub:'traditional',mod:'weightlifting'};
  if(/air\s*squat/.test(n))return{pat:'squat',sub:'traditional',mod:'gymnastics'};
  if(/\bbsu\b|box\s*step.?up/.test(n))return{pat:'squat',sub:'single_leg',mod:'gymnastics'};
  if(/pistol|lunge|step.?up|split\s*sq|bulgarian/.test(n))return{pat:'squat',sub:'single_leg',mod:'weightlifting'};
  // Jerk
  if(/jerk/.test(n))return{pat:'push',sub:'vertical',mod:'weightlifting'};
  // Hinge
  if(/sandbag\s*carry/.test(n))return{pat:null,sub:null,mod:'carries'};
  if(/sandbag/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/deadlift|rdl|romanian|good\s*morn|hip\s*ext/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/\bkbs\b|kb\s*swing|kettlebell\s*swing/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/kettlebell/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  if(/sdhp|sumo/.test(n))return{pat:'hinge',sub:null,mod:'weightlifting'};
  // Push — vertical
  if(/wall\s*walk/.test(n))return{pat:'push',sub:'vertical',mod:'gymnastics'};
  if(/hspu|handstand\s*(push|walk)/.test(n))return{pat:'push',sub:'vertical',mod:'gymnastics'};
  if(/hs\s*walk|handstand\s*walk/.test(n))return{pat:'push',sub:'vertical',mod:'gymnastics'};
  if(/s2oh|shoulder\s*to/.test(n))return{pat:'push',sub:'vertical',mod:'weightlifting'};
  if(/\bdip/.test(n))return{pat:'push',sub:'vertical',mod:'gymnastics'};
  if(/press/.test(n)&&!/bench|floor/.test(n))return{pat:'push',sub:'vertical',mod:'weightlifting'};
  // Push — horizontal
  if(/bench|floor\s*press/.test(n))return{pat:'push',sub:'horizontal',mod:'weightlifting'};
  if(/\bhrpu\b|hand\s*release\s*push/.test(n))return{pat:'push',sub:'horizontal',mod:'gymnastics'};
  if(/push.?up|seal\s*walk/.test(n))return{pat:'push',sub:'horizontal',mod:'gymnastics'};
  return{pat:null,sub:null,mod:null};
}

// ══════ MULTI-PATTERN CLASSIFIER ══════
const H={pat:'hinge',sub:null,mod:'weightlifting'};
const PV={pat:'push',sub:'vertical',mod:'weightlifting'};
const PH={pat:'push',sub:'horizontal',mod:'gymnastics'};
const RV={pat:'pull',sub:'vertical',mod:'weightlifting'};
const RH={pat:'pull',sub:'horizontal',mod:'weightlifting'};
// dualTon variants: secondary pattern also counts full tonnage (active pull to shoulder/overhead)
const RVd={pat:'pull',sub:'vertical',mod:'weightlifting',dualTon:true};
const RHd={pat:'pull',sub:'horizontal',mod:'weightlifting',dualTon:true};
const SQ={pat:'squat',sub:'traditional',mod:'weightlifting'};
const SL={pat:'squat',sub:'single_leg',mod:'weightlifting'};
const BD={pat:null,sub:'bounding',mod:'monostructural'};

function clsAll(nm){
  const n=(nm||'').toLowerCase().trim();
  const isDB=/(^|\s)(sa\s*|dbl\s*|double\s*|alt\s*)?(db|dumbbell|kb|kettlebell)/.test(n);

  // ── Compound gymnastics / odd-object ──
  if(/thrusters?/.test(n))return[SQ,PV];
  if(/\bbbjo\b|burpee\s*box\s*jump\s*over/.test(n))return[PH,BD];
  if(/\bbbso\b|burpee\s*box\s*step\s*over/.test(n))return[PH,BD];
  if(/devil'?s?\s*press/.test(n))return[PH,H,RV];
  if(/man\s*maker/.test(n))return[PH,{pat:'pull',sub:'horizontal',mod:'gymnastics'},SQ,PV];
  if(/curtis\s*p/.test(n))return[H,RV,SL,PV];
  if(/\bcluster\b/.test(n))return[H,RV,SQ,PV];

  // ── Clean & Jerk: hinge + vertical pull (active) + vertical push ──
  if(/^c&j$|clean\s*(and|&)\s*jerk/.test(n))return[H,RVd,PV];

  // ── Snatch DL / Snatch pull to hip: hinge only (no active overhead pull) ──
  if(/snatch\s*(dead\s*lift|dl\b|pull)|snatch\s*dl\s*to/.test(n))return[H,RH];

  // ── SDHP: hinge + vertical pull (active) ──
  if(/\bsdhp\b|sumo\s*(dead\s*lift|dl)?\s*high\s*pull/.test(n))return[H,RVd];

  // ── Deadlift family: hinge only ──
  if(/\brdl\b|romanian/.test(n))return[H];
  if(/dead\s*lift|deadlift/.test(n)&&!/snatch|high\s*pull|sdhp/.test(n))return[H];

  // ── Swing: hinge only (ballistic hip, not an active arm pull) ──
  if(/\bswing\b/.test(n))return[H];

  // ── Snatch variants: hinge + vertical pull (active) ──
  if(/snatch/.test(n)&&!/dead\s*lift|dl\b|pull\b/.test(n))return[H,RVd];

  // ── Clean variants (no jerk): hinge + vertical pull (active) ──
  if(/\bclean\b/.test(n)&&!/jerk|c&j/.test(n))return[H,RVd];

  // ── Sandbag clean / SB over shoulder: hinge + horizontal pull (active) ──
  if(/sandbag|over\s*shoulder/.test(n))return[H,RHd];

  return[cls(nm)];
}

// ══════ MOVEMENT NAME NORMALIZER ══════
function normMov(nm){
  if(!nm)return nm;
  const n=nm.toLowerCase().trim();
  // Toes to bar
  if(/^t2b$|^ttb$|toes\s*to\s*bar/.test(n))return'Toes to Bar';
  // Run variants (must come before shuttle)
  if(/shuttle\s*run/.test(n))return'Run';
  if(/\b(run|sprint|jog)\b/.test(n))return'Run';
  // Double / Single unders
  if(/^du$|^dus$|double\s*under/.test(n))return'Double Unders';
  if(/^su$|^sus$|single\s*under|jump\s*rope/.test(n))return'Single Unders';
  // Machines
  if(/^cal\s*row$/.test(n)||(/\brow\b/.test(n)&&!/(db|barbell|ring|pull|bent|pendlay|kb)/.test(n)))return'Row';
  if(/^cal\s*ski$/.test(n)||/\bski\b/.test(n))return'Ski Erg';
  if(/cal\s*bike|assault\s*bike|echo\s*bike|\bbike\b/.test(n))return'Bike';
  // Pull variants — specific first
  if(/\bc2b\b|chest.?to.?bar/.test(n))return'Chest to Bar';
  if(/^bmu$|bar\s*muscle.?up/.test(n))return'Bar Muscle-Up';
  if(/burpee\s*pull.?up/.test(n))return'Burpee Pull-Up';
  if(/^pull.?ups?$|^strict\s*pull.?ups?$/.test(n))return'Pull-Up';
  // Core
  if(/^k2e$|knee.*elbow/.test(n))return'Knees to Elbow';
  if(/^hkr$|hanging\s*knee\s*raise/.test(n))return'Hanging Knee Raise';
  if(/^v.?ups?$/.test(n))return'V-Up';
  if(/^sit.?ups?$/.test(n))return'Sit-Up';
  // KB / DB movements
  if(/^kbs$|kb\s*swing|kettlebell\s*swing/.test(n))return'KB Swing';
  if(/dbl\s*kb\s*farmer|double\s*kb\s*farmer/.test(n))return"Farmer's Carry";
  if(/^sb\s*carry$|sandbag\s*carry/.test(n))return'Sandbag Carry';
  if(/^sb\s*hold$|sandbag\s*hold/.test(n))return'Sandbag Hold';
  // Box variants
  if(/^bso$|box\s*step\s*over/.test(n))return'Box Step Over';
  if(/^bsu$|box\s*step.?up/.test(n))return'Box Step Up';
  if(/^b?bjo$|burpee\s*box\s*jump\s*over/.test(n))return'Burpee Box Jump Over';
  if(/^bbso$|burpee\s*box\s*step\s*over/.test(n))return'Burpee Box Step Over';
  if(/box\s*jump/.test(n)&&!/over/.test(n))return'Box Jump';
  if(/box\s*jump\s*over|box\s*jumps?\s*over/.test(n))return'Box Jump Over';
  // Burpee variants — specific compounds first, then collapse rest to Burpee
  if(/burpee\s*bso|burpee\s*box\s*step\s*over/.test(n))return'Burpee Box Step Over';
  if(/burpee\s*(over\s*(rower|kb|bar)|to\s*target)|lateral\s*burpee|line\s*facing\s*burpee/.test(n))return'Burpee';
  if(/burpees?\s*over\s*bar/.test(n))return'Burpee Over Bar';
  if(/^burpees?$/.test(n))return'Burpee';
  // Push / gymnastics
  if(/\bhspu\b|handstand\s*push.?up/.test(n))return'HSPU';
  if(/wall\s*walk/.test(n))return'Wall Walk';
  if(/wall\s*ball/.test(n))return'Wall Ball';
  if(/push.?up/.test(n)&&!/(ring|bar|hand\s*release|hrpu)/.test(n))return'Push-Up';
  if(/^hrpu$|hand\s*release\s*push/.test(n))return'Hand Release Push-Up';
  // S2OH → Push Jerk
  if(/^s2oh$|shoulder\s*to\s*overhead/.test(n))return'Push Jerk';
  // Jerk variants
  if(/pause\s*split\s*jerk|split\s*jerk/.test(n))return'Split Jerk';
  // Squat variants — specific first
  if(/pause\s*front\s*squat/.test(n))return'Front Squat';
  if(/\bback\s*squat/.test(n))return'Back Squat';
  if(/\bfront\s*squat/.test(n))return'Front Squat';
  if(/overhead\s*squat|\bohs\b/.test(n))return'OHS';
  // Snatch variants
  if(/lo\s*hang\s*squat\s*snatch|snatch\s*singles?|squat\s*snatch/.test(n))return'Squat Snatch';
  // Clean & Jerk variants
  if(/^c&j$|clean\s*(and|&)\s*jerk/.test(n))return'Clean & Jerk';
  // Thruster
  if(/thrusters?/.test(n))return'Thruster';
  // Lunge variants
  if(/walking\s*lunge/.test(n))return'Walking Lunge';
  if(/goblet\s*lunge/.test(n))return'Goblet Lunge';
  // DB Snatch variants
  if(/(sa\s*|alt\.?\s*|sa\s*alt\.?\s*)?(db|dumbbell)\s*(alt\.?\s*)?(hang\s*)?snatch/.test(n))return'DB Snatch';
  // Hinge / deadlift variants
  if(/^hps$|hang\s*power\s*snatch/.test(n))return'Hang Power Snatch';
  if(/power\s*cleans?$/.test(n))return'Power Clean';
  if(/db\s*bent\s*over\s*rows?/.test(n))return'DB Bent Over Row';
  if(/dbl\s*(db|kb)\s*(dead\s*lift|dl|deadlift)|double\s*(db|kb)\s*dead/.test(n))return'DB Deadlift';
  if(/deadlift/.test(n)&&!/(db|dbl|sumo|rdl|romanian|kb|hang|snatch)/.test(n))return'Deadlift';
  return nm;
}

function inferTd(fmt){
  if(!fmt)return null;
  const f=fmt.toLowerCase();
  let n=null;
  // "Every 6 minutes for 4 Rounds" or "Every 5:00 for 4 Rounds" → interval × rounds
  const evRounds=f.match(/every\s+(\d+)(?::\d{2})?\s*(?:min(?:utes?)?)?\s*(?:for\s+)?(\d+)\s*rounds?/);
  // "Every 9:00 for 36:00" → total duration is the second mm:ss
  const evDur=f.match(/every\s+\d+:\d{2}\s+for\s+(\d+):\d{2}/);
  // "EMOM 12:00" or "12:00 EMOM" → total minutes from mm:ss
  const emomMmss=f.match(/(?:emom\s+(\d+):\d{2}|(\d+):\d{2}\s+emom)/);
  // "28 min EMOM", "15 min AMRAP", "20 min cap" — plain minutes (must be first number before 'min')
  const plainMin=f.match(/(\d+)\s*min/);
  if(evRounds)n=parseInt(evRounds[1])*parseInt(evRounds[2]);
  else if(evDur)n=parseInt(evDur[1]);
  else if(plainMin)n=parseInt(plainMin[1]);
  else if(emomMmss)n=parseInt(emomMmss[1]||emomMmss[2]);
  if(n===null)return null;
  if(n<10)return'short';
  if(n<=20)return'med';
  return'long';
}
function sessTd(s){for(const b of(s.blocks||[]))if(b.k==='metcon'){const v=inferTd(b.fmt)||b.td;if(v)return v;}return null;}

function calPeriod(type,offset=0){
  const now=new Date();const today=now.toISOString().slice(0,10);let s;
  const days={week:7,month:30,quarter:90,year:365};
  if(type==='all')return{start:'2000-01-01',end:today};
  const d=days[type]||30;
  const totalDays=d*(offset+1);
  const prevDays=d*offset;
  const sDate=new Date(now);sDate.setDate(sDate.getDate()-totalDays+1);
  const eDate=new Date(now);eDate.setDate(eDate.getDate()-prevDays);
  return{start:sDate.toISOString().slice(0,10),end:eDate.toISOString().slice(0,10)};
}

function Delta({cur,prev}){
  if(prev===0&&cur===0)return html`<span class="delta delta-flat">—</span>`;
  if(prev===0)return html`<span class="delta delta-up">+NEW</span>`;
  const pct=Math.round(((cur-prev)/prev)*100);
  if(pct>0)return html`<span class="delta delta-up">↑${pct}%</span>`;
  if(pct<0)return html`<span class="delta delta-dn">↓${Math.abs(pct)}%</span>`;
  return html`<span class="delta delta-flat">—</span>`;
}

// ══════ WEIGHT PARSING HELPERS ══════
function parseWeight(w){
  if(!w&&w!==0)return 0;
  const s=String(w).trim();
  if(s.endsWith('%'))return 0;
  return parseFloat(s)||0;
}
function parseScoreWeight(score){
  if(!score)return 0;
  const m=String(score).match(/(\d+\.?\d*)\s*[@x]\s*(\d+\.?\d*)/);
  if(!m)return 0;
  return Math.max(parseFloat(m[1])||0,parseFloat(m[2])||0);
}
function parseScoreReps(score){
  if(!score)return 0;
  const m=String(score).match(/(\d+\.?\d*)\s*[@x]\s*(\d+\.?\d*)/);
  if(!m)return 0;
  return Math.min(parseFloat(m[1])||0,parseFloat(m[2])||0);
}
function calcStrengthTon(sets,score){
  if(!Array.isArray(sets))sets=[];
  // No sets — estimate from score (e.g. "1 @ 325" or "5 @ 245")
  if(!sets||!sets.length){
    const sw=parseScoreWeight(score);const sr=parseScoreReps(score);
    return sw>0&&sr>0?sw*sr:0;
  }
  // Helper to read pct from w or p field
  const getPct=x=>{const v=String(x.w||x.p||'').trim();return v.endsWith('%')?parseFloat(v)/100:null;};
  const hasPct=sets.some(x=>getPct(x)!==null);
  if(!hasPct){
    // Direct weights — straightforward
    return sets.reduce((s,x)=>s+(parseFloat(x.r)||0)*parseWeight(x.w||x.p),0);
  }
  // Percentage-based: back-calculate implied 1RM from score anchor
  const sw=parseScoreWeight(score);
  if(!sw)return 0;
  const pcts=sets.map(getPct).filter(p=>p!==null&&p>0);
  if(!pcts.length)return 0;
  const implied1RM=sw/Math.max(...pcts);
  const scoreReps=parseScoreReps(score);
  return sets.reduce((s,x)=>{
    const r=parseFloat(x.r)||(x.amrap?scoreReps:0);
    const pct=getPct(x);
    const w=pct!==null?Math.round(pct*implied1RM):parseWeight(x.w||x.p);
    return s+r*w;
  },0);
}

// ══════ AGGREGATION ══════
function agg(sessions,start,end){
  const filt=sessions.filter(s=>(!start||s.date>=start)&&(!end||s.date<=end));
  const pF={},pT={},pR={},mF={},mT={},mR={},sF={},sT={},td={short:0,med:0,long:0},mvs={};
  const mood={happy:0,neutralH:0,unhappy:0,hTotal:0,fun:0,neutralF:0,notfun:0,fTotal:0};
  let primaryTon=0;
  function add(nm,pat,sub,mod,reps,ton,date,isPrimary){
    if(isPrimary)primaryTon+=ton;
    if(pat){pF[pat]=(pF[pat]||0)+1;pT[pat]=(pT[pat]||0)+ton;pR[pat]=(pR[pat]||0)+reps;
      if(sub){const sk=pat+'_'+sub;sF[sk]=(sF[sk]||0)+1;sT[sk]=(sT[sk]||0)+ton;}}
    if(mod){mF[mod]=(mF[mod]||0)+1;mT[mod]=(mT[mod]||0)+ton;mR[mod]=(mR[mod]||0)+reps;}
    if(mod==='monostructural'&&sub){const mk='mono_'+sub;sF[mk]=(sF[mk]||0)+1;}
    if(nm){
      const key=normMov(nm)||nm;
      if(!mvs[key])mvs[key]={freq:new Set(),reps:0,ton:0,pat,sub,mod,last:''};
      mvs[key].freq.add(date);mvs[key].reps+=reps;mvs[key].ton+=ton;
      if(date>mvs[key].last)mvs[key].last=date;
      if(pat&&!mvs[key].pat){mvs[key].pat=pat;mvs[key].sub=sub;}
      if(mod&&!mvs[key].mod)mvs[key].mod=mod;
    }
  }
  for(const sess of filt){
    for(const b of(sess.blocks||[])){
      if(b.k==='strength'||b.k==='accessory'){
        const cs=clsAllCached(b.mov);
        const reps=(Array.isArray(b.sets)?b.sets:[]).reduce((s,x)=>s+(parseFloat(x.r)||(x.amrap?parseScoreReps(b.score):0)),0);
        const ton=calcStrengthTon(b.sets,b.score);
        cs.forEach((c,i)=>add(i===0?b.mov:null,c.pat,c.sub,i===0?c.mod:null,reps,(i===0||c.dualTon)?ton:0,sess.date,i===0));
      }
      if(b.k==='metcon'){
        const tdv=inferTd(b.fmt)||b.td||'unk';if(td[tdv]!==undefined)td[tdv]++;
        for(const pm of(b.pm||[])){
          const cs=clsAllCached(pm.n);
          const pr=parseFloat(pm.r)||0;const pw=parseFloat(pm.w)||0;
          cs.forEach((c,i)=>add(i===0?pm.n:null,c.pat,c.sub,i===0?c.mod:null,pr,(i===0||c.dualTon)?pr*pw:0,sess.date,i===0));
        }
      }
    }
  }
  for(const s of filt){
    if(s.happiness){mood.hTotal++;if(s.happiness==='happy')mood.happy+=1;else if(s.happiness==='unhappy')mood.unhappy+=0;else mood.neutralH+=0.5;}
    if(s.fun){mood.fTotal++;if(s.fun==='fun')mood.fun+=1;else if(s.fun==='notfun')mood.notfun+=0;else mood.neutralF+=0.5;}
  }
  const mvsFinal={};
  for(const[nm,d]of Object.entries(mvs))mvsFinal[nm]={...d,freq:d.freq.size};
  return{pF,pT,pR,mF,mT,mR,sF,sT,td,mvs:mvsFinal,cnt:filt.length,mood,primaryTon};
}

// ══════ CONSECUTIVE DAYS ══════
function getStreak(sessions){
  const dates=new Set(sessions.map(s=>s.date));
  const today=new Date().toISOString().slice(0,10);
  let streak=0;let d=new Date();
  // Check if today has a session
  if(!dates.has(today))d.setDate(d.getDate()-1);
  while(true){
    const ds=d.toISOString().slice(0,10);
    if(dates.has(ds)){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}
function lastRest(sessions){
  const dates=new Set(sessions.map(s=>s.date));
  const d=new Date();d.setDate(d.getDate()-1);
  for(let i=0;i<365;i++){
    const ds=d.toISOString().slice(0,10);
    if(!dates.has(ds))return ds;
    d.setDate(d.getDate()-1);
  }
  return null;
}

// ══════ CSV IMPORT HELPERS ══════
function parseCSVFile(text){
  const rows=[];let i=0;const n=text.length;let firstRow=true;
  while(i<n){
    const fields=[];
    while(i<n){
      let field='';
      if(text[i]==='"'){
        i++;
        while(i<n){
          if(text[i]==='"'&&text[i+1]==='"'){field+='"';i+=2;}
          else if(text[i]==='"'){i++;break;}
          else field+=text[i++];
        }
      }else{
        while(i<n&&text[i]!==','&&text[i]!=='\n'&&text[i]!=='\r')field+=text[i++];
      }
      fields.push(field);
      if(i<n&&text[i]===',')i++;else break;
    }
    while(i<n&&(text[i]==='\r'||text[i]==='\n'))i++;
    if(firstRow){firstRow=false;continue;}
    if(fields.length>=5&&fields[1]){
      const d=parseDateStr(fields[4]||'');
      if(d)rows.push({description:fields[1].trim(),score:(fields[2]||'').trim(),division:(fields[3]||'').trim(),date:d});
    }
  }
  return rows;
}
function parseDateStr(s){
  const m=s.match(/(\d+)\/(\d+)\/(\d+)/);
  if(!m)return'';
  return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
}

  // Derived

  // Trend table periods
  const TREND_COUNTS={week:8,month:6,quarter:4,year:3};
  function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  function calCalWeek(offset){
    const now=new Date();const day=now.getDay();
    const toMon=day===0?-6:1-day;
    const mon=new Date(now);mon.setDate(now.getDate()+toMon-offset*7);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return{start:localISO(mon),end:localISO(sun)};
  }
  function trendPeriod(type,offset){return type==='week'?calCalWeek(offset):calPeriod(type,offset);}
  function trendLabel(type,offset){
    const{start,end}=trendPeriod(type,offset);
    if(type==='week'){
      const s=new Date(start+'T12:00:00'),e=new Date(end+'T12:00:00');
      const sm=s.toLocaleDateString('en-US',{month:'short'});const em=e.toLocaleDateString('en-US',{month:'short'});
      const sd=s.getDate();const ed=e.getDate();
      return s.getMonth()===e.getMonth()?sm+' '+sd+'–'+ed:sm+' '+sd+'–'+em+' '+ed;
    }
    if(type==='month'){const d=new Date(start+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',year:'numeric'});}
    if(type==='quarter'){const d=new Date(start+'T12:00:00');return'Q'+(Math.floor(d.getMonth()/3)+1)+' '+d.getFullYear();}
    if(type==='year'){return new Date(start+'T12:00:00').getFullYear().toString();}
    return start;
  }
  const trendPeriods=useMemo(()=>{

    const rows=Object.entries(volAgg.mvs).map(([n,d])=>({n,...d}));
    const{col,dir}=mvSort;const m=dir==='desc'?-1:1;
    return rows.sort((a,b)=>{
      if(col==='n')return m*(a.n||'').localeCompare(b.n||'');
      if(col==='pat')return m*((a.pat||'')).localeCompare(b.pat||'');
      if(col==='mod')return m*((a.mod||'')).localeCompare(b.mod||'');
      if(col==='freq')return m*(a.freq-b.freq);
      if(col==='reps')return m*(a.reps-b.reps);
      if(col==='avg'){const aa=a.ton>0&&a.reps>0?a.ton/a.reps:0;const bb=b.ton>0&&b.reps>0?b.ton/b.reps:0;return m*(aa-bb);}
      if(col==='ton')return m*(a.ton-b.ton);
      if(col==='last')return m*(a.last||'').localeCompare(b.last||'');
      return 0;

  },[volAgg,mvSort]);

  const BENCHMARK_NAMES=['Fran','Grace','Helen','Kelly','Diane','Elizabeth','Angie','Barbara','Cindy','Annie','Isabel','Nancy','Karen','Jackie','Linda','Mary','Amanda','Eva','DT','Chelsea','Fight Gone Bad','Nasty Girls','Filthy Fifty','Murph'];
  function detectBenchmark(text,blocks){
    const t=(text||'').toLowerCase();
    for(const nm of BENCHMARK_NAMES){
      if(new RegExp('\\b'+nm.toLowerCase()+'\\b').test(t)){
        const metcon=(blocks||[]).find(b=>b.k==='metcon');
        return{name:nm,score:metcon?.score||''};
      }
    }
    return null;
  }
  async function updatePr(pr){
    if(!editPrVal.trim()||editPrSaving)return;
    setEditPrSaving(true);
    try{
      const raw=editPrVal.trim();
      // Parse value: time string (m:ss or h:mm:ss) → seconds, otherwise float
      let newVal;
      if(/^\d+:\d{2}(:\d{2})?$/.test(raw)){
        const p=raw.split(':').map(Number);
        newVal=p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];
      } else newVal=parseFloat(raw)||0;
      if(!newVal){setEditPrSaving(false);return;}
      const isImprovement=pr.category==='cardio'&&pr.pr_display&&/:\d{2}/.test(pr.pr_display)
        ?newVal<pr.pr_value   // lower time = better
        :newVal>pr.pr_value;  // higher = better for lifts/gymnastics/calories
      const hist=[...(pr.history||[]),{d:editPrDate,v:newVal}];
      const patch=isImprovement
        ?{pr_value:newVal,pr_display:raw,date:editPrDate,history:hist}
        :{history:hist};
      await fetch(SB_URL+'/rest/v1/prs?id=eq.'+pr.id,{method:'PATCH',headers:sbH(),body:JSON.stringify(patch)});
      const updated=await sbGet('prs','order=category,name');setPrs(updated);setEditPrId(null);
    }catch(e){console.error(e);}

  // ══════ WORKOUT GENERATOR HELPERS ══════
  function buildAthleteData(){
    const today=new Date().toISOString().slice(0,10);
    const cut14=new Date();cut14.setDate(cut14.getDate()-14);const cutStr=cut14.toISOString().slice(0,10);
    const cut3=new Date();cut3.setDate(cut3.getDate()-3);const cut3Str=cut3.toISOString().slice(0,10);
    const allRecent=sess.filter(s=>s.date>=cutStr).sort((a,b)=>b.date.localeCompare(a.date));
    function fmtSession(s){
      const parts=(s.blocks||[]).map(b=>{
        if(b.k==='strength')return'STR: '+(b.mov||'Unknown');
        if(b.k==='metcon'){const mvs=(b.pm||[]).slice(0,6).map(p=>normMov(p.n)||p.n).join(', ');return'MET: '+(b.fmt||'Metcon')+' ('+mvs+') | '+(b.td||'?')+' domain';}
        if(b.k==='accessory')return'ACC: '+(b.mov||'Unknown');
        return'';
      }).filter(Boolean).join(' | ');
      return fd(s.date)+': '+(parts||'Session');
    }
    const last3=allRecent.filter(s=>s.date>cut3Str);
    const older=allRecent.filter(s=>s.date<=cut3Str);
    const last3Days=last3.length===0?'No sessions in last 3 days — no avoidance constraints.':last3.map(fmtSession).join('\n');
    const recentSessions=older.length===0?'No sessions in days 4–14.':older.map(fmtSession).join('\n');
    const allAgg=agg(sess,'2000-01-01',today);
    const q90=calPeriod('quarter',0);const tdAgg=agg(sess,q90.start,q90.end);
    const patternBalance=PK.map(k=>{
      const f=allAgg.pF[k]||0;const t=allAgg.pT[k]||0;
      return PATS[k].l+': '+f+' sessions, '+(t>0?Math.round(t/1000)+'k lbs tonnage':'-');
    }).join('\n');
    const timeDomain='Short (<10min): '+tdAgg.td.short+' | Medium (10-20min): '+tdAgg.td.med+' | Long (20min+): '+tdAgg.td.long;
    const mvList=Object.entries(allAgg.mvs).map(([n,d])=>({n,...d})).sort((a,b)=>b.freq-a.freq).slice(0,20);
    const topMovements=mvList.map(m=>{const avg=m.ton>0&&m.reps>0?', avg '+Math.round(m.ton/m.reps)+' lbs':'';return m.n+': '+m.freq+' sessions'+avg;}).join('\n');
    const prStr=prs.filter(p=>p.category==='lift').map(p=>p.name+': '+p.pr_value+' lbs').join(', ')||'None logged';
    const moodSatisfied=allAgg.mood.hTotal>0?Math.round(allAgg.mood.happy/allAgg.mood.hTotal*100)+'%':'N/A';
    const moodFun=allAgg.mood.fTotal>0?Math.round(allAgg.mood.fun/allAgg.mood.fTotal*100)+'%':'N/A';
    return{last3Days,recentSessions,patternBalance,timeDomain,topMovements,prs:prStr,moodSatisfied,moodFun};
  }

        </div>`}
      </td>
    </tr>`;
  }
  function PrTab(){
    const BmForm=()=>html`<div style="background:#FFFFFF;border:1px solid #D0C9BC;border-radius:8px;padding:14px;margin-bottom:14px">

        <div style="flex:1;min-width:140px"><label style="font-size:9px;color:#9BA3AC;letter-spacing:1px;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px">Benchmark Name</label>
          <input class="inp" placeholder="e.g. Kelly, Fran, DT..." value=${bmName} onInput=${e=>setBmName(e.target.value)}/></div>

        <div style="flex:0 0 140px"><label style="font-size:9px;color:#9BA3AC;letter-spacing:1px;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px">Date</label>

        <button class="btn" onClick=${saveBenchmarkScore} disabled=${bmSaving||!bmName.trim()||!bmScore.trim()}>${bmSaving?html`<span class="spin" style="width:12px;height:12px;border-width:2px;vertical-align:middle;margin-right:4px"></span>Saving...`:'Save'}</button>
        <button style="background:transparent;color:#9BA3AC;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit" onClick=${()=>setBmOpen(false)}>Cancel</button>

    function AddPrForm({cat}){
      return html`<div style="background:#FFFFFF;border:1px solid #D0C9BC;border-radius:8px;padding:12px;margin-bottom:12px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:140px"><label style="font-size:9px;color:#9BA3AC;letter-spacing:1px;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px">Movement / Event</label>
            <input class="inp" placeholder=${cat==='lift'?'e.g. Strict Press':cat==='gymnastics'?'e.g. Ring Muscle-Up':'e.g. 400m Run'} value=${addPrName} onInput=${e=>setAddPrName(e.target.value)}/></div>
          <div style="flex:0 0 100px"><label style="font-size:9px;color:#9BA3AC;letter-spacing:1px;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px">${cat==='lift'?'Weight (lbs)':cat==='gymnastics'?'Reps':'Score'}</label>
            <input class="inp" placeholder=${cat==='lift'?'225':cat==='gymnastics'?'15':'5:30'} value=${addPrVal} onInput=${e=>setAddPrVal(e.target.value)}/></div>
          <div style="flex:0 0 140px"><label style="font-size:9px;color:#9BA3AC;letter-spacing:1px;text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px">Date</label>
            <input type="date" class="inp" value=${addPrDate} onInput=${e=>setAddPrDate(e.target.value)}/></div>
          <div style="display:flex;gap:6px">
            <button class="btn" style="padding:7px 14px" onClick=${addNewPr} disabled=${addPrSaving||!addPrName.trim()||!addPrVal.trim()}>${addPrSaving?html`<span class="spin" style="width:12px;height:12px;border-width:2px;vertical-align:middle"></span>`:'Add'}</button>
            <button style="background:transparent;color:#9BA3AC;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit" onClick=${()=>setAddPrCat(null)}>Cancel</button>
          </div>
        </div>
      </div>`;
    }
    return html`<div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #E0D9CF;padding-bottom:8px">
          <span class="ct" style="margin:0;border:none;padding:0">Lifting PRs</span>
          <button class="rn" style="font-size:10px" onClick=${()=>setAddPrCat(addPrCat==='lift'?null:'lift')}>+ Add PR</button>
        </div>
        ${addPrCat==='lift'&&AddPrForm({cat:'lift'})}
        <table><thead><tr><th>Movement</th><th>PR</th><th>Date</th><th></th></tr></thead>
        <tbody>${lifts.map(l=>html`<${PrRow} pr=${l} unit="lbs"/>`)}</tbody></table>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #E0D9CF;padding-bottom:8px">
          <span class="ct" style="margin:0;border:none;padding:0">Gymnastics PRs</span>
          <button class="rn" style="font-size:10px" onClick=${()=>setAddPrCat(addPrCat==='gymnastics'?null:'gymnastics')}>+ Add PR</button>
        </div>
        ${addPrCat==='gymnastics'&&AddPrForm({cat:'gymnastics'})}
        <table><thead><tr><th>Movement</th><th>PR</th><th>Date</th><th></th></tr></thead>
        <tbody>${gymPrs.map(l=>html`<${PrRow} pr=${l} unit="reps"/>`)}</tbody></table>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #E0D9CF;padding-bottom:8px">
          <span class="ct" style="margin:0;border:none;padding:0">Cardio PRs</span>
          <button class="rn" style="font-size:10px" onClick=${()=>setAddPrCat(addPrCat==='cardio'?null:'cardio')}>+ Add PR</button>
        </div>
        ${addPrCat==='cardio'&&AddPrForm({cat:'cardio'})}
        <table><thead><tr><th>Event</th><th>PR</th><th>Date</th><th></th></tr></thead>
        <tbody>${cardioPrs.map(c=>html`<${PrRow} pr=${c} unit=""/>`)}</tbody></table>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:2px solid #E0D9CF;padding-bottom:8px">
          <span class="ct" style="margin:0;border:none;padding:0">Benchmark WODs</span>
          <button class="rn" style="font-size:10px" onClick=${()=>openAddBenchmark()}>+ Add Benchmark</button>
        </div>
        ${bmOpen&&BmForm()}
        ${bench.map(b=>html`<div style="margin-bottom:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-weight:700;font-size:12px;color:#2B2825">${b.name}</span>
            <button style="background:transparent;color:#2B2825;border:none;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit" onClick=${()=>openAddBenchmark(b.name,'')}>+ Add Score</button>
          </div>
          <table><thead><tr><th>Date</th><th>Score</th><th>Notes</th></tr></thead>
          <tbody>${(b.scores||[]).map(s=>html`<tr>
            <td class="mut">${fd(s.d)}</td>
            <td class="prv">${s.v}</td>
            <td style="font-size:11px;color:#9BA3AC;max-width:400px">${s.note||''}</td>
          </tr>`)}</tbody></table>
        </div>`)}
      </div>
    </div>`;
  }

  // ══════ GENERATE TAB ══════
  function GenerateTab(){
    const hasGenerated=genMessages.some(m=>m.role==='assistant');
    const displayMsgs=genMessages.filter((_,i)=>i>0); // skip hidden trigger message
    return html`<div>
      <div class="card">
        <div class="ct">Workout Generator</div>
        ${!hasGenerated&&html`<div>
          <div style="margin-bottom:14px">
            <div style="font-size:9px;color:#9BA3AC;letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-bottom:8px">Components</div>
            <div style="display:flex;gap:8px">
              ${[['strength','Strength'],['metcon','Metcon'],['accessory','Accessory']].map(([k,l])=>html`
                <button class="rn ${genComponents[k]?'act':''}" onClick=${()=>setGenComponents(p=>({...p,[k]:!p[k]}))}>
                  ${genComponents[k]?'✓ ':''} ${l}
                </button>`)}
            </div>
          </div>
          <div style="margin-bottom:14px">
            <label style="font-size:9px;color:#9BA3AC;letter-spacing:1px;text-transform:uppercase;font-weight:600;display:block;margin-bottom:5px">Notes for today (optional)</label>
            <input class="inp" placeholder="e.g. sore from deadlifts, only 30 minutes, just want something fun..." value=${genContext} onInput=${e=>setGenContext(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&generate()}/>
          </div>
          ${genError&&html`<div class="err" style="margin-bottom:10px">${genError}</div>`}
          <button class="btn" onClick=${generate} disabled=${genLoading||!Object.values(genComponents).some(Boolean)}>
            ${genLoading?html`<span class="spin" style="width:14px;height:14px;border-width:2px;vertical-align:middle;margin-right:6px"></span> Generating...`:'Generate Workout'}
          </button>
        </div>`}
        ${hasGenerated&&html`<div>
          ${displayMsgs.map((m,i)=>html`<div key=${i} style=${{
            background: m.role==='assistant'?'#FDFBF6':'#EEF3F8',
            borderRadius:'8px',padding:m.role==='assistant'?'18px 16px':'10px 14px',
            marginBottom:'10px',
            fontFamily:'inherit',
            whiteSpace:'pre-wrap',
            fontSize:'12px',
            lineHeight:'1.75',
            color:'#2B2825',
            borderLeft:m.role==='assistant'?'3px solid #2B2825':'3px solid #B4C3D5'
          }}>
            ${m.role==='user'&&html`<div style="font-size:9px;font-weight:700;color:#B4C3D5;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px">You</div>`}
            ${m.content}
          </div>`)}
          ${genLoading&&html`<div style="display:flex;align-items:center;gap:8px;padding:12px;color:#9BA3AC;font-size:12px"><div class="spin"></div> Thinking...</div>`}
          ${genError&&html`<div class="err" style="margin-bottom:10px">${genError}</div>`}
          <div style="display:flex;gap:8px;margin-top:4px">
            <input class="inp" style="flex:1" placeholder="Ask a question, request changes, ask for reasoning..." value=${genInput} onInput=${e=>setGenInput(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&sendFollowUp()} disabled=${genLoading}/>
            <button class="btn" onClick=${sendFollowUp} disabled=${genLoading||!genInput.trim()}>Send</button>
          </div>
          <div style="margin-top:10px">
            <button style="background:transparent;color:#9BA3AC;border:none;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit" onClick=${()=>{setGenMessages([]);setGenContext('');setGenInput('');setGenError('');setGenAthleteData(null);}}>← New Workout</button>
          </div>
        </div>`}
      </div>
    </div>`;
  }

  // ══════ IMPORT TAB ══════
  function ImportTab(){
    function handleFile(e){
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        const parsed=parseCSVFile(ev.target.result);
        const byDate={};
        for(const row of parsed){
          if(!byDate[row.date])byDate[row.date]=[];
          byDate[row.date].push({desc:row.description,score:row.score,division:row.division});
        }
        const existDates=new Set(sess.map(s=>s.date));
        const toImport=[],toSkip=[];
        for(const [date,entries] of Object.entries(byDate).sort(([a],[b])=>b.localeCompare(a))){
          if(existDates.has(date))toSkip.push(date);
          else toImport.push({date,entries});
        }
        setImpRows(toImport);setImpSkip(toSkip);setImpDone(0);setImpTotal(0);
        setImpErrs([]);setImpComplete(false);setImpImporting(false);
      };
      reader.readAsText(file);
    }
    async function runImport(){
      if(impImporting)return;
      setImpImporting(true);setImpDone(0);setImpTotal(impRows.length);setImpErrs([]);setImpComplete(false);
      for(const {date,entries} of impRows){
        try{
          const allBlocks=[];const rawParts=[];
          for(const {desc,score,division} of entries){
            // Split workout from Notes section
            const splitIdx=desc.search(/\nNotes\s*:?/i);
            const workoutPart=splitIdx>=0?desc.slice(0,splitIdx).trim():desc.trim();
            const notesPart=splitIdx>=0?desc.slice(splitIdx):'' ;
            // Extract RX+/Scale notes for parser context
            const rxPlusMatch=notesPart.match(/RX\+\s*is\s*([^\n]+)/i);
            const scaleMatch=notesPart.match(/Scale\s*is\s*([^\n]+)/i);
            const rxPlusNote=rxPlusMatch?rxPlusMatch[1].trim():'';
            const scaleNote=scaleMatch?scaleMatch[1].trim():'';
            // Build parse text with division context
            let parseText=workoutPart;
            const div=(division||'').toUpperCase();
            if(div==='RX+'&&rxPlusNote)parseText+='\n\nAthlete performed RX+. RX+ modifications: '+rxPlusNote;
            else if(div==='SCALED'&&scaleNote)parseText+='\n\nAthlete scaled. Scale modifications: '+scaleNote;
            const r=await fetch('/api/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:parseText,date})});
            if(!r.ok){const e=await r.json();throw new Error(e.error||'Parse failed');}
            const parsed=await r.json();
            const blocks=parsed.blocks||[];
            // Always override score from CSV; store division
            if(blocks.length>0){
              const mi=blocks.findIndex(b=>b.k==='metcon');
              const idx=mi>=0?mi:blocks.length-1;
              if(score)blocks[idx].score=score;
              blocks[idx].rx=div==='RX'||div==='RX+'?true:false;
              if(div==='RX+')blocks[idx].rxPlus=true;
            }
            allBlocks.push(...blocks);
            rawParts.push(workoutPart);
          }
          await sbPost('sessions',[{date,blocks:allBlocks,raw_text:rawParts.join('\n\n---\n\n'),notes:'',happiness:'',fun:''}]);
        }catch(e){setImpErrs(prev=>[...prev,date+': '+e.message]);}
        setImpDone(d=>d+1);
      }
      const updated=await sbGet('sessions','order=date.desc');setSess(updated);
      setImpComplete(true);setImpImporting(false);
    }
    function reset(){setImpRows([]);setImpSkip([]);setImpDone(0);setImpTotal(0);setImpErrs([]);setImpComplete(false);}
    const hasPreview=impRows.length>0||impSkip.length>0;
    const pct=impTotal>0?Math.round(impDone/impTotal*100):0;
    return html`<div>
      <div class="card">
        <div class="ct">Import from Push Press</div>
        ${!hasPreview&&!impImporting&&html`<div>
          <div style="font-size:12px;color:#9BA3AC;margin-bottom:14px;line-height:1.7">Export your workout history from Push Press (account settings → export) and upload the CSV below. Dates already in your log will be skipped automatically. Each workout will be parsed and tagged exactly as if entered manually.</div>
          <label style="display:inline-block;cursor:pointer">
            <span class="btn">Choose CSV File</span>
            <input type="file" accept=".csv" style="display:none" onChange=${handleFile}/>
          </label>
        </div>`}
        ${hasPreview&&!impImporting&&!impComplete&&html`<div>
          <div class="g2" style="margin-bottom:14px">
            <div class="sc"><div class="sv">${impRows.length}</div><div class="sl">Sessions to Import</div></div>
            <div class="sc"><div class="sv">${impSkip.length}</div><div class="sl">Dates Skipped</div></div>
          </div>
          <div style="max-height:280px;overflow-y:auto;margin-bottom:14px;border:1px solid #D0C9BC;border-radius:7px">
            ${impRows.map(({date,entries})=>html`<div style="padding:8px 12px;border-bottom:1px solid #D0C9BC;display:flex;gap:12px;align-items:baseline">
              <span style="font-weight:700;font-size:11px;color:#2B2825;white-space:nowrap;flex:0 0 90px">${fd(date)}</span>
              <span style="font-size:11px;color:#9BA3AC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${entries.map(e=>e.desc.split('\n')[0].trim()).join(' · ')}</span>
            </div>`)}
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn" onClick=${runImport}>Import ${impRows.length} Sessions</button>
            <button style="background:transparent;color:#9BA3AC;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit" onClick=${reset}>Cancel</button>
          </div>
        </div>`}
        ${impImporting&&html`<div>
          <div style="font-size:12px;color:#9BA3AC;margin-bottom:8px">Importing ${impDone} of ${impTotal} sessions...</div>
          <div style="background:#D0C9BC;border-radius:4px;height:10px;margin-bottom:12px;overflow:hidden">
            <div style=${{background:'#2B2825',height:'10px',width:pct+'%',transition:'width .4s',borderRadius:'4px'}}></div>
          </div>
          ${impErrs.length>0&&html`<div class="err" style="margin-top:8px">${impErrs.map(e=>html`<div>${e}</div>`)}</div>`}
        </div>`}
        ${impComplete&&html`<div>
          <div class="${impErrs.length>0?'streak streak-y':'streak streak-g'}" style="margin-bottom:14px;text-align:center">
            <div style="font-size:26px;font-weight:700">${impDone-impErrs.length} / ${impTotal}</div>
            <div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;font-weight:600">Sessions Imported Successfully</div>
          </div>
          ${impErrs.length>0&&html`<div class="err" style="margin-bottom:12px"><div style="font-weight:700;margin-bottom:4px">Failed (${impErrs.length}):</div>${impErrs.map(e=>html`<div>${e}</div>`)}</div>`}
          <label style="display:inline-block;cursor:pointer;margin-right:10px">
            <span class="btn">Import Another File</span>
            <input type="file" accept=".csv" style="display:none" onChange=${handleFile}/>
          </label>
          <button style="background:transparent;color:#9BA3AC;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit" onClick=${reset}>Clear</button>
        </div>`}
      </div>
    </div>`;
  }

  const tabs=['Home','Sessions','PRs & Benchmarks','Create Session'];

  return html`<div>
    <div class="hdr"><svg viewBox="16 -4 336 262" height="38" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="cg" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#FFA184"/><stop offset="52%" stop-color="#FF765F"/><stop offset="100%" stop-color="#FF5E4D"/></linearGradient></defs><g transform="translate(8 4) scale(0.94)" fill="url(#cg)"><path d="M 14 256 C 15 244, 27 234, 41 232 L 60 232 C 70 232, 77 240, 77 249 C 77 257, 71 262, 61 262 L 26 262 C 18 262, 13 260, 14 256 Z"/><path d="M 91 246 L 106 185 C 110 166, 126 153, 145 153 C 166 153, 180 171, 176 191 L 162 246 C 159 257, 149 264, 137 264 L 111 264 C 97 264, 88 257, 91 246 Z"/><path d="M 173 231 L 193 142 C 197 122, 214 108, 234 108 C 255 108, 270 127, 266 147 L 247 231 C 244 248, 230 260, 213 260 L 192 260 C 178 260, 170 249, 173 231 Z"/><path d="M 257 207 L 283 89 C 287 69, 304 55, 324 55 C 345 55, 360 74, 356 94 L 331 207 C 327 226, 311 240, 292 240 L 275 240 C 262 240, 254 226, 257 207 Z"/><path d="M 344 19 A 24 24 0 1 1 296 19 A 24 24 0 1 1 344 19 Z"/></g></svg><div><h1>CrossFit</h1><div class="sub">Dashboard</div></div></div>
    <div class="nav">${tabs.map(t=>html`<button class=${tab===t?'act':''} onClick=${()=>setTab(t)}>${t}</button>`)}</div>
    <div class="bod">
      ${tab==='Home'&&HomeTab()}
      ${tab==='Sessions'&&LogTab()}
      ${tab==='PRs & Benchmarks'&&PrTab()}
      ${tab==='Create Session'&&GenerateTab()}
    </div>
  </div>`;
}

render(html`<${App}/>`,document.getElementById('app'));
</script>
</body>
